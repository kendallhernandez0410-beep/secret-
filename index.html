<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureVault — Redirigiendo</title>
  <script>
    // Redirección inteligente independientemente de la estructura desplegada
    if (window.location.pathname.includes('/frontend/public/')) {
      window.location.replace('./login.html');
    } else {
      window.location.replace('./frontend/public/login.html');
    }
  </script>
  <meta http-equiv="refresh" content="0; url=./frontend/public/login.html">
  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    a {
      color: #06b6d4;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h2>🛡️ SecureVault</h2>
  <p>Cargando aplicación... Si no redirige automáticamente, <a href="./frontend/public/login.html">haz clic aquí</a>.</p>
</body>
</html>
